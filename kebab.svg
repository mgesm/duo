<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kebabGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="kebabBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2333"/>
      <stop offset="100%" stop-color="#0F121C"/>
    </linearGradient>
    <filter id="kebabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo squircle premium -->
  <rect width="200" height="200" rx="46" fill="url(#kebabBg)"/>
  <rect x="1" y="1" width="198" height="198" rx="45" fill="none" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>

  <!-- Asador de Döner Kebab / Pincho y carnes asadas estilizadas -->
  <g transform="translate(100, 72)" filter="url(#kebabGlow)">
    <!-- Barra vertical central del asador -->
    <line x1="0" y1="-38" x2="0" y2="40" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Bloque cónico de carne döner tradicional con capas talladas -->
    <path d="M-26 -22 C-28 -8, -24 16, -14 30 L14 30 C24 16, 28 -8, 26 -22 C24 -28, -24 -28, -26 -22 Z" 
          fill="url(#kebabGold)"/>
          
    <!-- Líneas de corte tradicionales -->
    <path d="M-22 -14 C-10 -11, 10 -11, 22 -14" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M-20 -2 C-10 1, 10 1, 20 -2" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M-17 10 C-8 13, 8 13, 17 10" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M-12 21 C-6 23, 6 23, 12 21" stroke="#B45309" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Plato base giratorio del asador -->
    <ellipse cx="0" cy="31" rx="19" ry="4.5" fill="#64748B"/>
    <ellipse cx="0" cy="30" rx="18" ry="4" fill="#94A3B8"/>
    
    <!-- Cuchillo döner tradicional afilado a la derecha -->
    <path d="M30 -24 L36 -28 L28 26 L23 24 Z" fill="#E2E8F0" opacity="0.85"/>
    <rect x="33.5" y="-36" width="3" height="9" rx="1.5" fill="#F59E0B" opacity="0.9"/>
  </g>

  <!-- Tipografía Oficial City Döner -->
  <text x="100" y="138" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2.5">CITY DÖNER</text>
  <text x="100" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="700" font-size="11" fill="#F59E0B" text-anchor="middle" letter-spacing="4">KEBAB</text>
  
  <!-- Subtítulo Cartagena con punto sutil -->
  <g transform="translate(100, 174)">
    <rect x="-42" y="-9" width="84" height="15" rx="7.5" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
    <text x="0" y="2.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="600" font-size="8.5" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">CARTAGENA</text>
  </g>
</svg>
