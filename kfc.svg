<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kfcRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#C20D14"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="200" height="200" rx="46" fill="url(#kfcRed)"/>
  <rect x="1" y="1" width="198" height="198" rx="45" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Iconic 3 White Vertical Stripes of KFC Bucket -->
  <rect x="28" y="24" width="24" height="152" rx="12" fill="#FFFFFF" opacity="0.95"/>
  <rect x="88" y="24" width="24" height="152" rx="12" fill="#FFFFFF" opacity="0.95"/>
  <rect x="148" y="24" width="24" height="152" rx="12" fill="#FFFFFF" opacity="0.95"/>

  <!-- Center Glass Badge for Wordmark -->
  <rect x="22" y="66" width="156" height="68" rx="20" fill="rgba(194, 13, 20, 0.95)" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>

  <!-- Bold Official KFC Typography -->
  <text x="100" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="3.5">KFC</text>
</svg>
