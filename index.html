<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Duo — Decisiones compartidas</title>
  
  <!-- Mobile & iOS PWA meta tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duo">
  <link rel="manifest" href="./manifest.json">

  <!-- Favicon & iOS Web Clip Icon -->
  <link rel="icon" type="image/svg+xml" href="./duo_icon.svg">
  <link rel="apple-touch-icon" href="./duo_icon.svg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            p1: {
              main: '#FF2D55',
              glow: 'rgba(255, 45, 85, 0.4)',
              light: '#ffe4e6',
              dark: '#9f1239'
            },
            p2: {
              main: '#5E5CE6',
              glow: 'rgba(94, 92, 230, 0.4)',
              light: '#e0e7ff',
              dark: '#3730a3'
            }
          }
        }
      }
    }
  </script>

  <!-- Confetti script -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Custom styles Apple HIG & visionOS Liquid Glass -->
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-black text-slate-100 antialiased selection:bg-rose-500 selection:text-white min-h-screen relative overflow-x-hidden">

  <!-- Pantalla de inicio / Splash Screen OLED con trazado vectorial de Duo -->
  <div id="duo-splash-screen">
    <div class="relative w-44 h-44 sm:w-52 sm:h-52 flex items-center justify-center">
      <!-- Resplandor dinámico de fondo -->
      <div class="absolute inset-0 rounded-full bg-gradient-to-r from-rose-500/15 via-purple-500/25 to-indigo-500/15 blur-3xl scale-125 splash-glow-fade pointer-events-none"></div>

      <!-- SVG animado a gran tamaño -->
      <svg id="splash-logo-svg" viewBox="0 0 512 512" class="w-full h-full relative z-10 filter drop-shadow-[0_0_35px_rgba(168,85,247,0.3)]">
        <defs>
          <clipPath id="splashSquircleClip">
            <path d="M 0,256 C 0,59.39 59.39,0 256,0 C 452.61,0 512,59.39 512,256 C 512,452.61 452.61,512 256,512 C 59.39,512 0,452.61 0,256 Z" />
          </clipPath>

          <radialGradient id="splashOledBg" cx="50%" cy="20%" r="90%">
            <stop offset="0%" stop-color="#181524" />
            <stop offset="45%" stop-color="#0a0812" />
            <stop offset="100%" stop-color="#020204" />
          </radialGradient>

          <linearGradient id="splashTopSheen" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
            <stop offset="35%" stop-color="#ffffff" stop-opacity="0.03" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
          </linearGradient>

          <linearGradient id="splashInnerStroke" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
          </linearGradient>

          <!-- Gradiente Jugador 1: Rose -->
          <linearGradient id="splashGradP1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF375F" />
            <stop offset="50%" stop-color="#FF2D55" />
            <stop offset="100%" stop-color="#E00034" />
          </linearGradient>

          <!-- Gradiente Jugador 2: Indigo / Cyan -->
          <linearGradient id="splashGradP2" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#5E5CE6" />
            <stop offset="60%" stop-color="#0A84FF" />
            <stop offset="100%" stop-color="#40C8FF" />
          </linearGradient>

          <!-- Lente Púrpura de la Unión -->
          <radialGradient id="splashPurpleLens" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#D946EF" stop-opacity="0.85" />
            <stop offset="45%" stop-color="#A855F7" stop-opacity="0.50" />
            <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
          </radialGradient>

          <filter id="splashAtmosphericGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="36" result="blur" />
          </filter>
        </defs>

        <g clip-path="url(#splashSquircleClip)">
          <!-- Fondo OLED -->
          <rect width="512" height="512" fill="url(#splashOledBg)" />

          <!-- Halos atmosféricos traseros -->
          <circle cx="204" cy="256" r="130" fill="#FF2D55" opacity="0.22" filter="url(#splashAtmosphericGlow)" class="splash-glow-fade" />
          <circle cx="308" cy="256" r="130" fill="#0A84FF" opacity="0.22" filter="url(#splashAtmosphericGlow)" class="splash-glow-fade" />
          <circle cx="256" cy="256" r="75" fill="#A855F7" opacity="0.35" filter="url(#splashAtmosphericGlow)" class="splash-glow-fade" />

          <!-- Sombra bajo el primer aro -->
          <circle cx="204" cy="256" r="98" fill="none" stroke="#000000" stroke-width="26" opacity="0.4" class="splash-glow-fade" />

          <!-- Aro Izquierdo: Rojo / Rose con animación de trazado -->
          <circle cx="204" cy="256" r="98" fill="none" stroke="url(#splashGradP1)" stroke-width="24" stroke-linecap="round" transform="rotate(-90 204 256)" class="splash-draw-left" />
          <!-- Resplandor especular superior -->
          <path d="M 125,215 A 98 98 0 0 1 204,158" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" class="splash-highlight" />

          <!-- Aro Derecho: Azul / Cyan con animación de trazado -->
          <circle cx="308" cy="256" r="98" fill="none" stroke="url(#splashGradP2)" stroke-width="24" stroke-linecap="round" transform="rotate(-90 308 256)" style="mix-blend-mode: screen;" class="splash-draw-right" />
          <!-- Resplandor especular superior -->
          <path d="M 308,158 A 98 98 0 0 1 387,215" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" class="splash-highlight" />

          <!-- ÁREA DE UNIÓN: Lente translúcida púrpura que eclosiona cuando los aros se unen -->
          <ellipse cx="256" cy="256" rx="44" ry="76" fill="url(#splashPurpleLens)" style="mix-blend-mode: screen;" class="splash-lens-bloom" />

          <!-- Reflejo superior de vidrio -->
          <rect width="512" height="256" fill="url(#splashTopSheen)" pointer-events="none" class="splash-sheen" />
        </g>

        <!-- Borde exterior especular Apple Squircle -->
        <path d="M 0,256 C 0,59.39 59.39,0 256,0 C 452.61,0 512,59.39 512,256 C 512,452.61 452.61,512 256,512 C 59.39,512 0,452.61 0,256 Z" fill="none" stroke="url(#splashInnerStroke)" stroke-width="2" class="splash-sheen" />
      </svg>
    </div>
  </div>

  <!-- Ambient visionOS light orbs in background -->
  <div class="fixed top-[-80px] left-[-80px] w-96 h-96 rounded-full bg-rose-500/12 blur-[120px] pointer-events-none -z-10 animate-orb"></div>
  <div class="fixed bottom-[-80px] right-[-80px] w-96 h-96 rounded-full bg-indigo-500/12 blur-[140px] pointer-events-none -z-10 animate-orb" style="animation-delay: -6s;"></div>

  <!-- Shell principal optimizado para iPhone & Android nativo -->
  <div id="app" class="max-w-md mx-auto min-h-screen relative flex flex-col bg-black/85 border-x border-white/[0.08] shadow-[0_0_50px_rgba(0,0,0,0.9)]">
    <!-- El contenido se renderiza dinámicamente desde bundle.js -->
  </div>

  <!-- Banner nativo estilo iOS para instalación como WebApp / PWA -->
  <div id="ios-install-banner" class="hidden fixed bottom-4 left-4 right-4 z-40 max-w-md mx-auto p-3.5 rounded-[22px] bg-neutral-900/95 border border-white/15 backdrop-blur-2xl shadow-2xl text-white flex items-center justify-between gap-3 animate-ios-slide">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl p-0.5 shrink-0 flex items-center justify-center shadow-md">
        <img src="./duo_icon.svg" alt="Duo" class="w-full h-full object-contain rounded-xl" />
      </div>
      <div class="text-left">
        <div class="text-xs font-bold leading-tight">Instalar en tu iPhone / Móvil</div>
        <div class="text-[10px] text-neutral-400 mt-0.5">Pulsa <span class="text-sky-400 font-semibold">Compartir</span> y luego <span class="text-white font-semibold">"Añadir a pantalla de inicio"</span>.</div>
      </div>
    </div>
    <button id="btn-close-install" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-neutral-400 hover:text-white shrink-0">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- Modal para gestionar / añadir restaurantes -->
  <div id="modal-container"></div>

  <!-- Toast notification estilo Dynamic Island / iOS Capsule -->
  <div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 z-50 px-5 py-2.5 rounded-full text-xs font-semibold shadow-2xl border transition-all duration-300 opacity-0 pointer-events-none bg-neutral-900/90 text-white border-white/15 backdrop-blur-xl flex items-center gap-2">
    Mensaje
  </div>

  <!-- App logic (compatible con doble clic file:// y web/PWA) -->
  <script src="./bundle.js"></script>
  
  <!-- Registrar Service Worker si el navegador lo soporta -->
  <script>
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration note:', err);
        });
      });
    }
  </script>
</body>
</html>
